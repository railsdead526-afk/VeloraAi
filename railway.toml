[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"

[deploy]
# /ready performs a deep dependency check, so a replica that cannot reach the
# database, Redis, or the AI provider never receives traffic.
healthcheckPath = "/api/v1/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 2

# Revenue-critical. Without this, subscriptions never expire.
[[deploy.cronJobs]]
name = "maintenance"
schedule = "0 * * * *"
command = "python -m scripts.run_maintenance"
