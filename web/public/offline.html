<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velora AI — offline</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #121214;
        color: #ededed;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; font-weight: 600; margin: 20px 0 8px; }
      p { margin: 0 0 20px; color: #a1a1aa; line-height: 1.6; max-width: 30rem; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 11px 20px;
        font-size: 15px;
        font-weight: 500;
        color: #fff;
        background: #7c3aed;
        cursor: pointer;
      }
      button:hover { background: #6d28d9; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Kamu sedang offline</h1>
      <p>
        Velora AI butuh koneksi internet untuk menjawab. Percakapan yang sudah
        tersimpan akan muncul lagi begitu kamu terhubung.
      </p>
      <button onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
