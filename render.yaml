# Render Blueprint — deploy backend VeloraAi dengan sekali klik.
# Isi nilai bertanda sync:false di dashboard Render saat pertama kali deploy.
# Panduan lengkap: docs/DEPLOY-GRATIS.md

services:
  - type: web
    name: veloraai-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_SCHEMA
        value: veloraai
      - key: AI_PROVIDER
        value: gemini
      - key: PAYMENT_PROVIDER
        value: manual
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: RATE_LIMIT_STORAGE_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MANUAL_PAYMENT_INSTRUCTIONS
        sync: false
      - key: PRO_PRICE_IDR
        sync: false
      - key: MAX_PRICE_IDR
        sync: false
