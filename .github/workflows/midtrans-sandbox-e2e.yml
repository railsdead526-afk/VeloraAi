name: Midtrans Sandbox E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: ci-midtrans-e2e-secret-key-012345678901234567890123
      AI_PROVIDER: mock
      RATE_LIMIT_STORAGE_URI: memory://
      CORS_ORIGINS: http://localhost:3000
      MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
      MIDTRANS_IS_PRODUCTION: "false"
      RUN_MIDTRANS_SANDBOX_E2E: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Check Sandbox credentials
        id: credentials
        shell: bash
        run: |
          if [[ -z "$MIDTRANS_SERVER_KEY" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "MIDTRANS_SERVER_KEY is not configured; skipping real Sandbox E2E."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Midtrans Sandbox E2E
        if: steps.credentials.outputs.available == 'true'
        run: pytest -q tests/test_midtrans_sandbox_e2e.py -m midtrans_e2e
      - name: Explain skipped Sandbox E2E
        if: steps.credentials.outputs.available != 'true'
        run: echo "Sandbox E2E skipped. Add the MIDTRANS_SERVER_KEY GitHub secret to enable real gateway tests."
