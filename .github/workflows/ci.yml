name: VeloraAi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: ci-test-secret-key-012345678901234567890123
      AI_PROVIDER: mock
      RATE_LIMIT_STORAGE_URI: memory://
      CORS_ORIGINS: http://localhost:3000
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "1536"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run SQLite tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: velora
          POSTGRES_PASSWORD: velora
          POSTGRES_DB: velora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U velora -d velora_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      DATABASE_URL: postgresql://velora:velora@localhost:5432/velora_test
      SECRET_KEY: ci-test-secret-key-012345678901234567890123
      AI_PROVIDER: mock
      RATE_LIMIT_STORAGE_URI: memory://
      CORS_ORIGINS: http://localhost:3000
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "1536"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate PostgreSQL migrations
        run: alembic upgrade head
      - name: Verify migration head
        run: alembic current
