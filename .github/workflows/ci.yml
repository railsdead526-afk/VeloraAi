name: VeloraAi CI

on:
  push:
    branches:
      - main
      - audit/health-hardening
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: ci-test-secret-key-012345678901234567890123
      AI_PROVIDER: mock
      RATE_LIMIT_STORAGE_URI: memory://
      CORS_ORIGINS: http://localhost:3000
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "1536"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run SQLite tests with coverage
        run: pytest -q tests --cov=app --cov-report=term-missing

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: velora
          POSTGRES_PASSWORD: velora
          POSTGRES_DB: velora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U velora -d velora_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      DATABASE_URL: postgresql://velora:velora@localhost:5432/velora_test
      SECRET_KEY: ci-test-secret-key-012345678901234567890123
      AI_PROVIDER: mock
      RATE_LIMIT_STORAGE_URI: memory://
      CORS_ORIGINS: http://localhost:3000
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "1536"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate PostgreSQL migrations
        run: alembic upgrade head
      - name: Verify migration head
        run: alembic current
      - name: Run backend tests against PostgreSQL
        run: pytest -q tests --cov=app --cov-report=term-missing

  sandbox-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sandbox-service
    env:
      SANDBOX_SERVICE_TOKEN: test-token
      SANDBOX_ROOT: /tmp/velora-sandbox-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sandbox-service/requirements.txt
      - name: Install sandbox dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile sandbox service
        run: python -m compileall -q sandbox_app.py tests
      - name: Run sandbox service tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
