name: VeloraAi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks enumerates the commits on a pull request to scan only the diff.
  # On a private repository the default token cannot read that endpoint, and
  # the job fails with 403 "Resource not accessible by integration".
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Shared test configuration. No real secrets are used anywhere in CI.
  APP_ENV: test
  APP_DEBUG: "false"
  SECRET_KEY: ci-test-secret-key-012345678901234567890123
  AI_PROVIDER: mock
  RATE_LIMIT_STORAGE_URI: memory://
  CORS_ORIGINS: http://localhost:3000
  EMBEDDING_MODEL: text-embedding-3-small
  EMBEDDING_DIMENSIONS: "1536"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check app tests scripts
      - name: Ruff format check
        run: ruff format --check app tests scripts
      - name: Type check
        run: mypy

  tests:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:///./test.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q app tests scripts
      - name: Run tests with an enforced coverage floor
        run: >-
          pytest -q tests
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=72
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: velora
          POSTGRES_PASSWORD: velora
          POSTGRES_DB: velora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U velora -d velora_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://velora:velora@localhost:5432/velora_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Verify head revision
        run: alembic current
      - name: Verify every migration is reversible
        run: |
          alembic downgrade base
          alembic upgrade head
      # Autogenerate diffs are noisy on server defaults, so drift is reported
      # as a warning rather than a hard gate.
      - name: Report model/migration drift
        continue-on-error: true
        run: alembic check

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Audit backend dependencies
        run: pip-audit -r requirements.txt --strict
      - name: Audit sandbox dependencies
        run: pip-audit -r sandbox-service/requirements.txt --strict
      - name: Static security analysis
        run: ruff check --select S app scripts
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sandbox-service:
    name: Sandbox service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sandbox-service
    env:
      SANDBOX_SERVICE_TOKEN: test-token
      SANDBOX_ROOT: /tmp/velora-sandbox-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: sandbox-service/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m compileall -q sandbox_app.py tests
      - run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Type check
        run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  docker:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: veloraai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: veloraai:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, tests, migrations, security, sandbox-service, frontend, docker]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if echo '${{ join(needs.*.result, ',') }}' | grep -qE 'failure|cancelled'; then
            echo "::error::One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs succeeded."
